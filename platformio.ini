[platformio]
default_envs = esp32_sender, esp32_receiver

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17

[env:esp32_sender]
build_flags = ${env.build_flags} -DDEVICE_ROLE_SENDER=1

[env:esp32_receiver]
build_flags = ${env.build_flags} -DDEVICE_ROLE_RECEIVER=1
