<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura e conexões do protótipo AES-GCM com ESP-NOW</title>
  <desc id="desc">Duas placas ESP32 ligadas por USB ao computador para gravação e serial, trocando mensagens cifradas por rádio ESP-NOW no canal 1.</desc>
  <rect width="1100" height="520" fill="#f6f8fb" rx="20"/>
  <text x="550" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#152238">Duas ESP32: AES-256-GCM sobre ESP-NOW</text>
  <rect x="60" y="130" width="280" height="210" rx="18" fill="#fff" stroke="#1b6ca8" stroke-width="3"/>
  <text x="200" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152238">ESP32 remetente</text>
  <text x="200" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#30445e">Texto digitado no Serial</text>
  <text x="200" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#30445e">AES-256-GCM</text>
  <text x="200" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#30445e">Serial: 115200 baud</text>
  <text x="200" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52657d">USB integrado; sem GPIO externo</text>
  <rect x="760" y="130" width="280" height="210" rx="18" fill="#fff" stroke="#25805a" stroke-width="3"/>
  <text x="900" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152238">ESP32 receptora</text>
  <text x="900" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#30445e">ESP-NOW broadcast</text>
  <text x="900" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#30445e">Valida tag AES-GCM</text>
  <text x="900" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#30445e">Exibe texto autenticado</text>
  <text x="900" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52657d">USB integrado; sem GPIO externo</text>
  <path d="M350 225 H750" stroke="#7447a8" stroke-width="5" stroke-dasharray="12 9"/>
  <path d="M735 213 L755 225 L735 237" fill="none" stroke="#7447a8" stroke-width="5"/>
  <text x="550" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#56327f">Rádio Wi-Fi 2,4 GHz • Canal 1</text>
  <text x="550" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#56327f">pacote cifrado + nonce + tag</text>
  <rect x="345" y="390" width="410" height="76" rx="12" fill="#e8eef5" stroke="#aab8c8" stroke-width="2"/>
  <text x="550" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#152238">Computador / VS Code + PlatformIO</text>
  <text x="550" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#30445e">USB em cada placa para gravação, energia e Serial</text>
  <path d="M200 345 V374 L375 390" fill="none" stroke="#65758b" stroke-width="3"/>
  <path d="M900 345 V374 L725 390" fill="none" stroke="#65758b" stroke-width="3"/>
  <text x="550" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#607086">Nenhum sensor, display ou teclado ligado nesta versão base.</text>
</svg>
